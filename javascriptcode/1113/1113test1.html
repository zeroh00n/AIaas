    <script>
        let arr = ['H', 'W', "G", 'J', 'M', 'V', 'P'];

        for(let i = 0; i <arr.length-1; i++){
          for(let j = 0; j<arr.length -i -1; j++){
              if(arr[j+1] < arr[j]){
                   let tmp = arr[j];
                   arr[j] = arr[j+1];
                   arr[j+1] = tmp;
               }
           }
        }  
        for(let i in arr){
            document.writeln(arr[i]);
        }
