<script>
    let n = 1;
    while(n<10){
        let m = 1;
        while(m<10){
            document.writeln(n + " X " + m + " = " + n*m + "<br>");
            m+=1;
        }
        document.writeln("---------------<br>");
        n+=1;
    }
</script>
