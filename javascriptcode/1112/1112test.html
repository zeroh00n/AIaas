<script>
    let n = 2;
    while(n <= 1000){
        let m = 2; 
        let count = 0;
        while(m < n){
            if(n%m == 0){
                count++;
            }
            if(count > 0){break;}
            m++;
        }
        if(count == 0){
            document.writeln(n)
        }
        n++;
    }
</script>
